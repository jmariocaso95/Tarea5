spring:
  application:
    name: TareaClase5

  r2dbc:
    url: r2dbc:h2:mem:///tareasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    pool:
      initial-size: 5
      max-size: 20
      validation-query: "SELECT 1"



server:

  port: 8080

  error:

    include-message: never       # Nosotros controlamos los mensajes de error

    include-stacktrace: never



management:

  endpoints:

    web:

      exposure:

        include: health, info, metrics



# ============================================

# Configuración propia de la aplicación

# (la leeremos con @ConfigurationProperties)

# ============================================

app:

  negocio:

    stock-minimo-para-eliminar: 0

    descuento-maximo-porcentaje: 50

    max-productos-por-categoria: 100

  clientes:

    categorias:

      base-url: https://fakestoreapi.com

      timeout-segundos: 5